var QS=[
["Risk","What's your relationship to risk?","Risk paralyzes you. You won't take it.","You embrace risk easily."],
["Change","What's your relationship to change?","You resist change and fight to keep things as they are.","You'll create change if it isn't happening."],
["Logic","How do you process logically?","You need each step explained, A to B to C.","You make quantum leaps and fill in the blanks."],
["Variables","How many ideas can you juggle at once before you tip into stress?","Just a few. More than that and you're stressed.","A lot, and you're not stressed about it."],
["Ambiguity","What's your relationship to ambiguity?","You need things concrete before you move forward.","You can sit in ambiguity without stress."],
["Opportunity","What's your relationship to opportunity?","You see problems and tasks before opportunity.","You see opportunity everywhere, all the time."]];
var OPEN=[
["What's something you could talk about for hours without getting bored?",""],
["What would you do more of if time and money weren't a factor?",""],
["What's something you have that most people around you don't?","A skill, a tool, a resource, or a connection."],
["What's something you've done at work or at home that you're genuinely proud of right now?",""],
["What does a typical week look like for you right now?",""]];
var TYPES=[
{n:"Detailer",r:"1–2",line:"Precise, dependable, grounded in the real work. You finish what you start and catch what others miss.",body:["Detailers get the work done. You turn vision into a finished, accurate, repeatable result. You document things. You follow procedure. You notice the missing comma, the wrong line item, the unsigned form. Where others see a finished project, you see the loose threads, and you quietly tie them off. The world doesn't function without people like you. Every event that starts on schedule, every database that stays clean, every safety check that gets done is the work of a Detailer.", "Underneath all of that, you carry a deep sense of responsibility. When something is yours to handle, you handle it. You don't need credit or a stage, and you'd rather be trusted with the keys than cut the ribbon. People may not see how much weight you're quietly carrying, but they feel the difference when you're not in the room."],think:[["Risk averse by design", "You protect what matters from costly mistakes. You don't see this as fear. You see it as stewardship. Why move fast when moving carefully gets the right outcome?"], ["Focused scope", "Your best work happens with a few well-defined variables at a time. Too many open loops and your brain starts working overtime to close them all, which is exhausting."], ["Step by step", "You move from A to B to C with clarity at each stage. You don't leap. Skipping steps feels like building on a foundation you didn't pour yet."], ["Concrete thinking", "You need the spec, the example, the answer before you can move forward. Vague briefs frustrate you. “We'll figure it out” is not a plan."], ["Problem and task oriented", "You see what needs fixing and what needs doing: the broken hinge, the typo, the empty slot. Where others see the room, you see the work."]],thrive:"You thrive in roles with clear deliverables, established systems, and a defined rhythm. You love doing the same thing well, year after year, and getting better at it. People with your wiring often work as bookkeepers, schedulers, data administrators, technicians, production crew, nurses, paralegals, project coordinators, accountants, or executive assistants: anyone whose work keeps the systems running that other people rely on. You feel engaged when the work is meaningful, the standards are high, and you're trusted to deliver.",edge:"Your bias toward concrete and proven systems can become rigidity. When change is necessary, you may resist it longer than is healthy, or want something documented and proven before you'll engage, which can stall progress. Your growth edge is learning to lean into change before you have all the information, especially when leadership is asking you to. You won't lose your gift for precision by trusting people earlier. The other edge is delegation. You may avoid handing things off because nobody does it the way you do. Letting things be done at 80 percent by someone else is part of how a church grows beyond what you can personally hold."},
{n:"Developer",r:"3–4",line:"Leads people up close. Runs teams, manages process, keeps things moving without losing the human side.",body:["Developers run the team. You have enough concrete-thinking grit to keep the work moving and enough people instinct to keep humans engaged while it moves. You are the frontline supervisor, the team lead, the ministry coordinator, the person who gets a group of volunteers to actually show up and do the thing. Your superpower is putting out brush fires before they become wildfires. You notice when a teammate is off, when a process is breaking down, or when a deadline is sliding, and you step in early, often without anyone above you noticing.", "What makes you different from a pure Detailer is that you care about the people doing the work as much as the work itself. You can run a tight ship without making people miserable. You catch the volunteer who almost quit last week, the teammate who's overcommitted, the new person who hasn't been welcomed yet. Your work is half organizational and half pastoral, even when the title doesn't say so."],think:[["Moderate risk comfort", "You handle change well when you understand the goal behind it. Tell you the why, and you'll get the team there. Spring change on you with no context, and you'll push back, but for good reason."], ["Multiple variables", "You can hold a team, a calendar, a process, and a problem without tipping into stress. Your bandwidth is wider than a Detailer's, but you still need things reasonably defined."], ["Concrete with abstract reach", "You bias toward concrete thinking but can hold abstract goals. You'll sit through the vision meeting and translate it into something your team can do on Tuesday."], ["Fast diagnosis", "You spot problems quickly because you live inside the system: the tone of a teammate's email, the dip in attendance, the volunteer who didn't show up two weeks in a row."], ["People instincts", "You sense who needs encouragement and who needs accountability. You're not just managing tasks. You're shepherding a small group of humans, and you know it."]],thrive:"You thrive as a team leader, department supervisor, frontline manager, classroom teacher, or anyone whose job is to lead a small group through real work. You're at your best with a defined scope, a team to lead, and the authority to decide how the work gets done. You don't need to set the vision, but you do need to own the execution within it. People with your wiring often work as operations managers, shift leads, school teachers, charge nurses, coaches, social workers, or anyone whose role is half organizational and half pastoral.",edge:"The instinct that makes you a great frontline leader can become control. You may rescue your team too often, fixing what they should be learning to fix themselves, and that creates a team that needs you to function. Your growth edge is restraint: letting a teammate stumble through something they could have handled if you hadn't stepped in. The other edge is bigger thinking. You're so close to the work that you can miss what's happening across the organization. Make time to step back and ask what your team's effort is building toward. That altitude is what turns a strong team lead into a leader who could one day run something bigger."},
{n:"Builder",r:"5–6",line:"Holds the whole picture. Equally comfortable with strategy and details, vision and execution.",
 body:["Builders manage the whole store. You have enough abstract thinking to hold a vision and enough concrete thinking to run things. You can sit in a vision meeting in the morning and a budget review in the afternoon and contribute to both. You can take a Strategist's big idea and translate it into something a Developer's team can execute. You are the connective tissue of an organization.","The cost is that you're often the most fluent translator in the room, and that role can wear you out. The win is that organizations don't grow without people like you. Vision without execution is a sermon. Execution without vision is a treadmill."],
 think:[["Real change tolerance","You handle meaningful change and risk, especially when you've helped shape the plan. You don't fear change, but you want it to be intentional."],["Many variables","You handle multiple departments, people, and timelines at once. Your stress threshold is high, but not infinite."],["Concrete to abstract","You move between zoomed-in details and zoomed-out vision in the same conversation. Most people lean one way. You can do both."],["Organizational instinct","You see how the whole system fits together and connect dots others don't see."],["Natural mediator","You can speak both languages when teams clash, and get the Strategist and the Detailer into the same productive conversation."]],
 blend:["Builder with Strategist tendencies", "You run things, and you're already thinking about what to start next. Most Builders are content to optimize what already exists. You're not. You handle operations well, but you have entrepreneurial instincts that occasionally make your steady leadership feel restless. This is the wiring of someone who could one day start something new. The growth edge is honoring the work you have today while making space for new ideas, without letting them pull your focus from what you're actually responsible for."], thrive:"You thrive with real responsibility across multiple areas, authority to decide things, and a partner whose job is to look further ahead than yours. Pure execution roles will eventually bore you, and pure vision roles will frustrate you. People with your wiring often coordinate multiple moving parts and turn big-picture goals into work that gets done.",
 edge:"You hold complexity well, but you can hold too much for too long. Builders often become the bottleneck of the very organizations they're trying to scale. Your growth edge is learning what only you can do and delegating the rest. The other edge is the abstract end of the wavelength: stay close to people who think bigger than you do, and read more than you think you need to."},
{n:"Strategist",r:"7–8",line:"Starts things. Sees opportunities, takes initiative, moves fast. Best at launching what doesn't exist yet.",body:["Strategists are entrepreneurs and innovators. You see opportunity where others see problems. You walk into a room and notice the empty space, the audience nobody is reaching, the gap nobody is filling, and you want to do something about it. You start things. You think abstractly enough to imagine what doesn't yet exist and concretely enough to insist that it work. Unlike Visionaries, you care about the prototype. You want to see version one ship, and once you're convinced it works, you hand it off and look for the next opportunity.", "You are wired for motion. Standing still feels like loss. That hunger is a gift to a growing church, but it has weight. The Detailers and Developers running the day to day may need a slower pace than you do. The best version of you doesn't just start things. You start things that other people can carry forward."],think:[["Risk embraced", "You understand that not moving is also a risk. Inaction is its own kind of decision, and you're willing to act on that."], ["Change creator", "You're bored by steady state. When everything is humming along, your instinct isn't to celebrate. It's to ask what's next."], ["Quantum leaps", "You jump from A to M to Z and expect others to fill in the middle. People sometimes need you to walk them through the path you took."], ["Ambiguity tolerant", "You're comfortable starting before everything is figured out. You'd rather build the plane in the air than wait until every detail is locked."], ["Opportunity eyes", "Yesterday's win is already history. Sometimes that's a strength, and sometimes it makes people feel unseen for the work they just finished."]],thrive:"You thrive when you have something real to start: a new audience, a new market, a problem worth solving. You're at your best with the freedom to begin things and the support to get them off the ground. You won't last long in a role that's purely about maintaining what already exists. People with your wiring often work as founders, entrepreneurs, business development leads, product managers, church planters, lead pastors, or anyone who spots opportunity and runs at it before it's obvious. The pattern isn't title. It's that you're allergic to standing still while there's ground to take.",edge:"You start things, and that gift is needed. But finishing is the other half, and it's harder because the excitement is gone. Your growth edge is sticking with an initiative past the point where it's still interesting to you. The team you started and the volunteer you recruited need you to stay engaged longer than your wiring naturally wants. The other edge is people. You see opportunities so clearly that you can run past the humans who have to deliver them. The fastest path forward is rarely the one that leaves your people behind."},
{n:"Visionary",r:"9–10",line:"Thinks ahead. Sees what could exist before anyone else does. Lives in ideas and possibility.",body:["Visionaries imagine what could be. You live at the conceptual level. You see frameworks, theories, possibilities, and patterns long before anyone else does. You are bright, articulate, and persuasive. When a Visionary describes the future, people lean in. Bringing things to closure isn't your strength, and that's not a flaw. It's your wiring. Your gift is the seminal concept, the new framework, the question nobody else is asking yet.", "You think in altitude. While most people are working with the next 90 days, you're often somewhere between five years out and the meaning of the universe. That can feel isolating, because the world rewards finishers. But the church needs you. Theology, vision, doctrine, and the long view of where this is all going get developed by people willing to sit with the big questions long enough for new answers to emerge."],think:[["Risk fully embraced", "The risk of an idea is part of its appeal. The bigger the leap, the more interesting the question. Safety is rarely your motivation."], ["Change as default", "You see change as the natural state of the world. You don't experience it as disruption. You experience it as how things are."], ["Enormous leaps", "You jump from A to Z and then to a different alphabet entirely. Conversations with you can feel like watching a river change course mid-sentence. It's not random. It just runs faster than most people can track."], ["At home in ambiguity", "You don't need things resolved to keep thinking. You can sit in the unresolved for months, even years, and find it generative rather than stressful."], ["Macro view", "You sketch what doesn't exist yet. Details and operations slow you down. Your contribution is the new map, not walking the old one."]],thrive:"You thrive in roles where your primary job is thinking. You need the time and permission to follow ideas where they lead, and the trust of leadership when your conclusions don't immediately translate to a deliverable. People with your wiring often work as researchers, writers, professors, designers, theologians, teaching pastors, consultants, or novelists: anyone whose value is the framework they generate rather than the work they execute. Pair you with someone who can run with what you generate, and you become a force multiplier.",edge:"Your ideas can feel disconnected from the lived reality of people running the day to day. When you're not careful, your contribution becomes beautiful but unreachable. Your growth edge is building bridges between your thinking and the operational world. Find a Builder or a Strategist you trust, and run your ideas through them before you bring them to the larger team. The other edge is finishing. You don't have to become a closer, but you do have to learn to hand things off cleanly. Half-finished frameworks confuse people. A clear handoff to someone who can finish is one of the most pastoral things you can offer."}];
var SERVE={"Detailer": {"serve": "You are the engine room. Set Up and Tear Down is a natural home, because the rhythm and precision suit you and Sunday doesn't happen without it. Vine Kids needs your accuracy with names, allergies, and pickup. Guest Services benefits from your consistency, week after week. Security runs on people who notice what's out of place and follow the plan every time. Behind-the-scenes roles on the Worship team need the same reliability. When our Care team launches, your steady follow-through will matter: remembering to check in and keeping track of who needs what.", "intro": "If you lean introvert, your wiring runs in the quiet places. You'll likely thrive in Set Up and Tear Down before anyone arrives, in behind-the-scenes Worship roles, or in the steady background work of Care follow-up. You do your best work alone or with a small, steady team.", "extro": "If you lean extrovert, your precision shows up in front of people. You're the consistent face at Guest Services who remembers what someone told you last week, or the warm and accurate check-in at Vine Kids. People start to count on you for it."}, "Developer": {"serve": "You are a natural team lead. Guest Services and Vine Kids both run on someone who keeps volunteers showing up and catches problems early, so a team captain or room lead is a strong fit. Set Up and Tear Down needs someone to organize the crew and keep it moving. Security benefits from a calm coordinator. Your people instincts are exactly what the Care team will need, since you notice who is off before anyone says a word.", "intro": "If you lean introvert, your leadership runs quieter. You'll likely thrive coordinating volunteer schedules, checking in one-on-one with a teammate who is struggling, or doing Care follow-up behind the scenes.", "extro": "If you lean extrovert, you lead from the front. You'll likely thrive running the huddle before service, greeting and encouraging your volunteers, and being the visible point person for a Guest Services or Vine Kids team."}, "Builder": {"serve": "You will feel most alive owning something with several moving parts. Coordinating across teams, such as scheduling and communication between Guest Services, Vine Kids, and Set Up and Tear Down, plays to your wiring. The new Care team is a strong fit because someone needs to build the system for how care gets noticed and followed up. You also bring a translator's voice to Worship and Security, helping ideas become something the team can carry out. Don't pick the team that's purely a checklist. Pick the one where your wiring gets room.", "intro": "If you lean introvert, you're the steady force behind the scenes. You plan the rotation, notice the gap, and build the system. Your gift is often invisible until it's missing.", "extro": "If you lean extrovert, you connect people and run the room. You'll likely thrive recruiting and organizing volunteers, leading a team meeting, and coordinating across ministries in real time."}, "Strategist": {"serve": "You want something to start. The Care team is a strong fit because it's being built right now, and you can see what's missing and begin to fill it. Guest Services and Vine Kids can use your eye for who we're not reaching yet and how to welcome them better. You'll be less engaged in roles that are purely about maintaining what exists, so pair up with a Builder or Developer who can carry your ideas forward on teams like Set Up and Tear Down, Security, and Worship.", "intro": "If you lean introvert, your contribution shows up as spotting gaps and drafting the plan. You'll likely thrive proposing improvements and quietly launching small, useful ideas.", "extro": "If you lean extrovert, you launch things out loud. You'll likely thrive inviting people in, recruiting for a new team, and leading the first season of something new."}, "Visionary": {"serve": "You will thrive where depth and ideas matter more than logistics. The Care team is a strong fit, because people in hard seasons need thoughtful presence, and you can help shape how we think about caring well. On Vine Kids, you can help shape how children hear big truths, including writing and teaching content. On Worship, you can help shape the meaning behind what we sing. Set Up and Tear Down, Security, and Guest Services are less natural fits, so don't pick a team that is purely about running a checklist.", "intro": "If you lean introvert, your contribution comes through writing, prayer, and deep one-on-one conversation. You'll likely thrive listening well on the Care team or writing content for our teams.", "extro": "If you lean extrovert, your contribution is more visible. You'll likely thrive teaching in a group, speaking up in a conversation, and shaping ideas with a team in the room."}};
var LOW=[1,3,5,7,9];
var S={step:0,a:[],gut:null,open:["","","","",""],name:"",email:"",err:""};
var TOTAL=1+1+6+1+1+5+1;
var app=document.getElementById("app"),prog=document.getElementById("prog");
function h(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function head(){return '<div class="brand">SOMA CITY · WAZE</div>'}
function scale(val,key){var b="";for(var i=1;i<=10;i++)b+='<button type="button" aria-pressed="'+(val===i)+'" data-'+key+'="'+i+'">'+i+'</button>';return '<div class="scale">'+b+'</div>'}
function score(){var avg=S.a.reduce(function(x,y){return x+y},0)/6;var i=avg<3?0:avg<5?1:avg<7?2:avg<9?3:4;var d=avg-LOW[i],tend=null;
 if(i===2&&d>=1.25)tend=3;return{avg:Math.round(avg*10)/10,i:i,t:tend}}
function render(){
 prog.style.width=Math.round(S.step/(TOTAL-1)*100)+"%";var s=S.step,o="";
 if(s===0){o=head()+'<h1>Find where you fit.</h1><p>WAZE is a short assessment to help you understand how you think and where you\'ll thrive at Soma City.</p><p class="muted small">About 5 minutes. 12 quick questions. 5 possible types.</p><blockquote class="verse">For as in one body we have many members, and the members do not all have the same function, so we, though many, are one body in Christ.<br><b>Romans 12:4-5</b></blockquote><div class="row"><button class="btn" data-go="1">Begin</button></div>';}
 else if(s===1){o=head()+'<p class="muted small">Part 1 of 2 · How you think</p><h2>A few quick questions about how your brain works.</h2><p>For each one, pick a number from 1 to 10. If you\'re stuck, lean one way rather than landing in the middle. Your gut reaction is usually right.</p><div class="row"><button class="btn" data-go="2">Got it</button></div>';}
 else if(s<=7){var q=QS[s-2],v=S.a[s-2];o=head()+'<p class="muted small">Question '+(s-1)+' of 6 · '+q[0]+'</p><h2>'+q[1]+'</h2>'+scale(v,"q")+'<div class="ends"><span>1: '+q[2]+'</span><span>10: '+q[3]+'</span></div><div class="row"><button class="btn ghost" data-go="'+(s-1)+'">Back</button><button class="btn" data-next="1" '+(v?"":"disabled")+'>Next</button></div>';}
 else if(s===8){o=head()+'<p class="muted small">Gut check</p><h2>Which one of these sounds the most like you?</h2><p class="small muted">Pick the number in the range that fits you best. Don\'t overthink it.</p><div class="types">'+TYPES.map(function(t){return '<div class="type"><b>'+t.n+'</b> <span class="muted">('+t.r+')</span><br><span class="small">'+t.line+'</span></div>'}).join("")+'</div>'+scale(S.gut,"g")+'<div class="ends"><span>1: Detailer</span><span>10: Visionary</span></div><div class="row"><button class="btn ghost" data-go="7">Back</button><button class="btn" data-go="9" '+(S.gut?"":"disabled")+'>Next</button></div>';}
 else if(s===9){o=head()+'<p class="muted small">Part 2 of 2 · About you</p><h2>Five questions to help us understand you.</h2><p>These take a little more reflection. A few sentences each is plenty. Your answers go to our pastoral team to help us get to know you before we meet. Nothing is shared publicly.</p><div class="row"><button class="btn" data-go="10">Continue</button></div>';}
 else if(s<=15){var k=s-10,q2=OPEN[k];o=head()+'<p class="muted small">Question '+(k+1)+' of 5</p><h2>'+q2[0]+'</h2>'+(q2[1]?'<p class="muted">'+q2[1]+'</p>':'')+'<label for="oa">Your answer</label><textarea id="oa">'+h(S.open[k])+'</textarea><div class="row"><button class="btn ghost" data-go="'+(s-1)+'">Back</button><button class="btn" data-open="'+k+'">Next</button></div>';}
 else if(s===16){o=head()+'<h2>Who are you?</h2><p>We\'ll send your results to your email so you can keep them.</p><label for="nm">Full name</label><input id="nm" autocomplete="name" value="'+h(S.name)+'"><label for="em">Email</label><input id="em" type="email" autocomplete="email" value="'+h(S.email)+'">'+(S.err?'<p class="err" role="alert">'+S.err+'</p>':'')+'<div class="row"><button class="btn ghost" data-go="15">Back</button><button class="btn" id="sub">Get my results</button></div>';}
 else{var r=score(),T=TYPES[r.i],nx=r.t!==null?TYPES[r.t]:null;
  o=head()+'<div class="hero"><p class="small" style="margin:0 0 6px" id="hi"></p><h1>'+T.n+'</h1>'+(nx?'<p>with strong '+nx.n+' tendencies</p>':'')+(T.body?T.body.map(function(x){return '<p>'+x+'</p>'}).join(''):'<p>'+T.line+'</p>')+'</div>'+gauge(r);
  if(T.body){o+='<h3>How you think</h3>'+T.think.map(function(x){return '<div class="item"><strong>'+x[0]+'</strong>'+x[1]+'</div>'}).join('');
   if(nx&&T.blend)o+='<h3>Your blend</h3><p><b>'+T.blend[0]+'</b></p><p>'+T.blend[1]+'</p>';
   var sv=SERVE[T.n];o+='<h3>Where you thrive</h3><p>'+T.thrive+'</p><h3>Where you serve at Soma City</h3><p>'+sv.serve+'</p><p class="muted small" style="margin:0">Our Care team is launching soon.</p><h3>Your social wiring</h3><div class="item"><p style="margin:0">'+sv.intro+'</p></div><div class="item"><p style="margin:0">'+sv.extro+' Both flavors are essential to the body. Neither is more spiritual than the other.</p></div><h3>Growth edges</h3><p>Every type has a growth edge. Yours isn\'t a weakness. It\'s part of what God is shaping in you.</p><p>'+T.edge+'</p>';}
  else o+='<div class="todo"><b>To finish before launch:</b> the full write-up for '+T.n+' has not been added yet.</div>';
  o+='<h3>What\'s next</h3><div class="item"><strong>Check your email.</strong>A summary of your results is on its way. Save it and bring it to our next membership class.</div><div class="item"><strong>Watch for our next membership class.</strong>It\'s our get-to-know-you class. Details are coming from our team.</div><div class="item"><strong>Show up curious.</strong>What you got here isn\'t a label. It\'s a conversation starter.</div><p class="note">'+(CONFIG.ENDPOINT?'':'Preview mode: nothing was sent anywhere.')+'</p><p class="muted small">Soma City Church · WAZE</p>';}
 app.innerHTML=o;if(s===17)document.getElementById("hi").textContent="Hey "+(S.name||"friend")+", you are a";window.scrollTo(0,0)}
function gauge(r){var pos=Math.max(0,Math.min(90,(r.avg-1)/10*100)),pl=Math.max(9,Math.min(91,pos));
 return '<div class="gauge"><p style="margin:0;font-weight:700">Your wavelength</p><p class="muted small" style="margin:0">Concrete to abstract</p><div class="gtrack"><span class="gpill" style="left:'+pl+'%">'+r.avg+' / 10</span><span class="gtick" style="left:'+pos+'%"></span></div><div class="segs">'+TYPES.map(function(t,i){return '<div class="seg'+(i===r.i?' on':'')+'">'+t.n+'</div>'}).join('')+'</div><div class="gnums"><span>1</span><span>3</span><span>5</span><span>7</span><span>10</span></div></div>'}
function submit(){var n=document.getElementById("nm").value.trim(),e=document.getElementById("em").value.trim();S.name=n;S.email=e;
 if(n.split(/\s+/).length<2||!/^\S+@\S+\.\S+$/.test(e)){S.err="Enter your first and last name and a valid email address.";return render()}
 var r=score(),p={church:CONFIG.CHURCH,name:n,email:e,type:TYPES[r.i].n,tendency:r.t!==null?TYPES[r.t].n:null,wavelength:r.avg,answers:S.a,gutCheck:S.gut,reflections:OPEN.map(function(q,i){return{question:q[0],answer:S.open[i]}}),submittedAt:new Date().toISOString()};
 if(!CONFIG.ENDPOINT){S.err="";S.step=17;return render()}
 var b=document.getElementById("sub");b.disabled=true;b.textContent="Calculating your results";
 fetch(CONFIG.ENDPOINT,{method:"POST",body:JSON.stringify(p)}).then(function(x){return x.json()}).then(function(j){if(!j.ok)throw 0;S.err="";S.step=17;render()}).catch(function(){S.err="Couldn't submit. Check your connection and try again.";render()})}
app.addEventListener("click",function(ev){var t=ev.target.closest("button");if(!t)return;var d=t.dataset;
 if(d.go){S.step=+d.go;render()}
 else if(d.q){S.a[S.step-2]=+d.q;render()}
 else if(d.next){S.step++;render()}
 else if(d.g){S.gut=+d.g;render()}
 else if(d.open!==undefined){S.open[+d.open]=document.getElementById("oa").value;S.step++;render()}
 else if(t.id==="sub")submit()});
render();
</script>
